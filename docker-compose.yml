services:
  postgres:
    image: postgres:16-alpine
    environment:
      POSTGRES_DB: training_tracking
      POSTGRES_USER: training
      POSTGRES_PASSWORD: training
    ports:
      - "5432:5432"
    volumes:
      - postgres-data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U training -d training_tracking"]
      interval: 5s
      timeout: 5s
      retries: 10

  backend:
    build: ./backend
    restart: on-failure:5
    environment:
      DB_HOST: postgres
      DB_PORT: 5432
      DB_NAME: training_tracking
      DB_USER: training
      DB_PASSWORD: training
      CORS_ALLOWED_ORIGINS: http://localhost:5500,http://127.0.0.1:5500
      # No mail host locally, so password reset codes go to the backend log instead.
      PASSWORD_RESET_LOG_CODE: "true"
    ports:
      - "8080:8080"
    depends_on:
      postgres:
        condition: service_healthy

  frontend:
    build: .
    restart: on-failure:5
    ports:
      - "5500:80"
    depends_on:
      - backend

volumes:
  postgres-data:
