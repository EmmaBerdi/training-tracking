spring:
  application:
    name: tracking-backend
  datasource:
    url: jdbc:postgresql://${DB_HOST:localhost}:${DB_PORT:5432}/${DB_NAME:training_tracking}
    username: ${DB_USER:training}
    password: ${DB_PASSWORD:training}
  jpa:
    hibernate:
      ddl-auto: validate
    open-in-view: false
  liquibase:
    enabled: true
    change-log: classpath:db/changelog/db.changelog-master.xml
  servlet:
    multipart:
      # Exercise setup photos, the only upload the API takes. The service enforces 2 MB on the file
      # itself; this is the container-level backstop that stops a larger body being buffered at all.
      max-file-size: 3MB
      max-request-size: 3MB

server:
  port: ${SERVER_PORT:8080}

app:
  cors:
    allowed-origins: ${CORS_ALLOWED_ORIGINS:http://localhost:5500,http://127.0.0.1:5500}
  jwt:
    secret: ${JWT_SECRET:dev-only-secret-change-me-dev-only-secret-change-me}
    access-token-ttl: ${JWT_ACCESS_TTL:PT15M}
    refresh-token-ttl: ${JWT_REFRESH_TTL:P30D}
