spring:
  application:
    name: tracking-backend
  datasource:
    url: jdbc:postgresql://${DB_HOST:localhost}:${DB_PORT:5432}/${DB_NAME:training_tracking}
    username: ${DB_USER:training}
    password: ${DB_PASSWORD:training}
  jpa:
    hibernate:
      ddl-auto: validate
    open-in-view: false
  liquibase:
    enabled: true
    change-log: classpath:db/changelog/db.changelog-master.xml
  servlet:
    multipart:
      # Exercise setup photos, the only upload the API takes. The service enforces 2 MB on the file
      # itself; this is the container-level backstop that stops a larger body being buffered at all.
      max-file-size: 3MB
      max-request-size: 3MB
  # Outgoing mail, used only for password reset codes. Left without a host, no mail is sent — see
  # Mailer and docs/BACKEND.md.
  mail:
    host: ${MAIL_HOST:}
    port: ${MAIL_PORT:587}
    username: ${MAIL_USERNAME:}
    password: ${MAIL_PASSWORD:}
    properties:
      mail.smtp.auth: true
      mail.smtp.starttls.enable: true
      # Jakarta Mail builds the Message-ID from this address; unset, it uses the container's
      # hostname, a domain that doesn't match the sender and counts against the mail in spam filters.
      mail.from: ${MAIL_FROM:}

server:
  port: ${SERVER_PORT:8080}

app:
  cors:
    allowed-origins: ${CORS_ALLOWED_ORIGINS:http://localhost:5500,http://127.0.0.1:5500}
  jwt:
    secret: ${JWT_SECRET:dev-only-secret-change-me-dev-only-secret-change-me}
    access-token-ttl: ${JWT_ACCESS_TTL:PT15M}
    refresh-token-ttl: ${JWT_REFRESH_TTL:P30D}
  mail:
    from: ${MAIL_FROM:}
    # Shown instead of the bare address in the inbox, e.g. "NOREPLY Berdi racing".
    from-name: ${MAIL_FROM_NAME:}
  password-reset:
    # Logs the reset code when no mail host is set. Local development only: a logged code is a
    # password to anyone who can read the logs.
    log-code: ${PASSWORD_RESET_LOG_CODE:false}
  # Per client IP, on the anonymous /api/auth endpoints. Behind the Cloudflare tunnel every request
  # arrives from cloudflared, so the Pi deploy sets the header to CF-Connecting-IP. Left empty, the
  # socket address counts — never name a header that no proxy in front overwrites, or a client can
  # pick a fresh key for every request.
  rate-limit:
    client-ip-header: ${RATE_LIMIT_CLIENT_IP_HEADER:}
    login:
      max-attempts: 10
      window: PT15M
    register:
      max-attempts: 5
      window: PT1H
    # Shared by requesting a code and confirming it.
    password-reset:
      max-attempts: 10
      window: PT1H
  # Per user. Pictures not (yet) referenced by the plan count too; they are swept before an upload
  # is refused.
  images:
    max-count: ${IMAGES_MAX_COUNT:200}
    max-total-size: ${IMAGES_MAX_TOTAL_SIZE:100MB}
