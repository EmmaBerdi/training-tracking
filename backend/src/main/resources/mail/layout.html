<!DOCTYPE html>
<html lang="de">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<meta name="color-scheme" content="dark">
<meta name="supported-color-schemes" content="dark">
<title>{{subject}}</title>
<style>
:root { color-scheme: dark; supported-color-schemes: dark; }
</style>
</head>
<body style="margin:0;padding:0;background-color:#17171a;">
<table role="presentation" width="100%" cellpadding="0" cellspacing="0" border="0" bgcolor="#17171a" style="background-color:#17171a;">
<tr>
<td align="center" style="padding:40px 12px;">
<table role="presentation" width="100%" cellpadding="0" cellspacing="0" border="0" bgcolor="#202026" style="max-width:520px;background-color:#202026;border:1px solid #32323c;border-radius:10px;">
<tr>
<td style="padding:20px 32px;border-bottom:1px solid #32323c;font-family:-apple-system,BlinkMacSystemFont,'Segoe UI',Roboto,Helvetica,Arial,sans-serif;font-size:20px;font-weight:700;line-height:22px;color:#edebe6;">
<span style="display:inline-block;width:10px;height:22px;margin-right:10px;vertical-align:middle;background-color:#f2c14e;border-radius:2px;"></span><span style="vertical-align:middle;">Training</span>
</td>
</tr>
<tr>
<td style="padding:32px;font-family:-apple-system,BlinkMacSystemFont,'Segoe UI',Roboto,Helvetica,Arial,sans-serif;font-size:16px;line-height:1.5;color:#edebe6;">
<h1 style="margin:0 0 16px;font-size:22px;line-height:1.3;font-weight:700;color:#edebe6;">{{heading}}</h1>
{{paragraphs}}
<table role="presentation" width="100%" cellpadding="0" cellspacing="0" border="0" bgcolor="#17171a" style="background-color:#17171a;border:1px solid #46465a;border-radius:8px;">
<tr>
<td align="center" style="padding:20px 0 20px 10px;font-family:ui-monospace,'SF Mono',Menlo,Consolas,monospace;font-size:38px;font-weight:700;letter-spacing:10px;color:#f2c14e;">{{code}}</td>
</tr>
</table>
<p style="margin:12px 0 16px;font-size:14px;text-align:center;color:#a3a3ad;">{{validity}}</p>
<div style="height:1px;margin:0 0 16px;line-height:1px;font-size:1px;background-color:#32323c;">&nbsp;</div>
<p style="margin:0;font-size:14px;color:#a3a3ad;">{{note}}</p>
</td>
</tr>
</table>
<p style="max-width:520px;margin:20px auto 0;font-family:-apple-system,BlinkMacSystemFont,'Segoe UI',Roboto,Helvetica,Arial,sans-serif;font-size:12px;line-height:1.5;text-align:center;color:#9a9aa4;">{{footer}}</p>
</td>
</tr>
</table>
</body>
</html>
