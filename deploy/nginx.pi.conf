# nginx for the Raspberry Pi deployment: serves the built frontend and reverse-proxies /api to the
# backend, so browser and API share one origin. Mounted over the image's own conf by
# docker-compose.pi.yml; the repo-root nginx.conf still drives the plain static build.

server {
    listen 80;
    server_name _;
    root /usr/share/nginx/html;
    index index.html;

    # Exercise setup photos: the API caps a file at 2 MB and Spring buffers up to 3 MB, so nginx's
    # 1 MB default would reject the upload before it ever reached the backend.
    client_max_body_size 3m;

    # Docker's embedded DNS, and the upstream held in a variable so nginx resolves it per request
    # instead of at startup. After a power cut the daemon restarts containers in no particular
    # order, and a literal proxy_pass would make nginx exit outright if the backend isn't up yet.
    resolver 127.0.0.11 valid=10s ipv6=off;

    location /api/ {
        set $backend http://backend:8080;
        proxy_pass $backend$request_uri;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        # The tunnel terminates TLS, so the backend only ever sees plain HTTP on this hop.
        proxy_set_header X-Forwarded-Proto https;
        proxy_read_timeout 60s;
    }

    # Vite fingerprints everything under /assets/, so those are safe to cache forever.
    location /assets/ {
        add_header Cache-Control "public, max-age=31536000, immutable";
    }

    # Cloudflare caches .js by default. Left alone, an edge-cached service worker would keep
    # handing out the previous build long after a deploy, which is exactly the update path
    # docs/SETUP.md promises works by itself.
    location ~ ^/(sw\.js|registerSW\.js|index\.html|manifest\.webmanifest)$ {
        add_header Cache-Control "no-cache";
    }

    location / {
        try_files $uri $uri/ /index.html;
    }
}
