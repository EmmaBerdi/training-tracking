# Production stack for the Raspberry Pi: Postgres, the backend, nginx (static frontend + /api
# reverse proxy) and the Cloudflare tunnel that publishes it. See docs/DEPLOY-PI.md.
#
#   docker compose -f deploy/docker-compose.pi.yml --env-file deploy/.env up -d --build
#
# Only nginx binds a host port, and it defaults to 8090 rather than 80 so nothing collides with
# what already runs on the Pi. Postgres and the backend listen on the compose network only.

name: training

services:
  postgres:
    image: postgres:16-alpine
    restart: unless-stopped
    environment:
      POSTGRES_DB: ${DB_NAME:-training_tracking}
      POSTGRES_USER: ${DB_USER:-training}
      POSTGRES_PASSWORD: ${DB_PASSWORD:?set DB_PASSWORD in deploy/.env}
    volumes:
      - postgres-data:/var/lib/postgresql/data
    healthcheck:
      test: ['CMD-SHELL', 'pg_isready -U ${DB_USER:-training} -d ${DB_NAME:-training_tracking}']
      interval: 10s
      timeout: 5s
      retries: 10

  backend:
    build:
      context: ../backend
    restart: unless-stopped
    environment:
      DB_HOST: postgres
      DB_PORT: 5432
      DB_NAME: ${DB_NAME:-training_tracking}
      DB_USER: ${DB_USER:-training}
      DB_PASSWORD: ${DB_PASSWORD:?set DB_PASSWORD in deploy/.env}
      JWT_SECRET: ${JWT_SECRET:?set JWT_SECRET in deploy/.env}
      # nginx puts the app and the API on one origin, so no browser sends a cross-origin request
      # here. Pinned to the real hostname anyway, so a direct call from anywhere else fails closed.
      CORS_ALLOWED_ORIGINS: https://${APP_HOSTNAME:?set APP_HOSTNAME in deploy/.env}
      # A Pi shares its RAM with Postgres; left alone the JVM would size its heap off the whole box.
      JAVA_TOOL_OPTIONS: -Xmx512m
    depends_on:
      postgres:
        condition: service_healthy

  frontend:
    build:
      context: ..
      args:
        # Same origin as the page, so the client never needs to know the hostname it is served from.
        VITE_API_BASE: /api
    restart: unless-stopped
    ports:
      - '${HOST_PORT:-8090}:80'
    volumes:
      - ./nginx.pi.conf:/etc/nginx/conf.d/default.conf:ro
    depends_on:
      - backend

  # Dials out to Cloudflare, so the Pi needs no port forwarding and no inbound firewall hole.
  tunnel:
    image: cloudflare/cloudflared:latest
    restart: unless-stopped
    command: tunnel --no-autoupdate run --token ${TUNNEL_TOKEN:?set TUNNEL_TOKEN in deploy/.env}
    depends_on:
      - frontend

volumes:
  postgres-data:
